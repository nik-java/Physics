<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnetfeld – Eisenfeilspäne</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#d8d8d8}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#d8d8d8}
canvas{position:absolute;inset:0;width:100%;height:100%}
.title{position:absolute;top:14px;left:50%;transform:translateX(-50%);
background:rgba(255,255,255,.9);padding:9px 18px;border-radius:12px;
font-size:clamp(17px,2.2vw,28px);font-weight:bold;z-index:3}
.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
background:rgba(255,255,255,.88);padding:7px 13px;border-radius:9px;
font-size:clamp(11px,1.35vw,16px);color:#444;z-index:3}
.modebtn{position:absolute;top:14px;right:14px;z-index:5;
background:rgba(255,255,255,.92);border:1px solid #bbb;border-radius:10px;
padding:9px 16px;font-size:clamp(12px,1.5vw,16px);font-weight:600;color:#222;
cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18);font-family:Arial,sans-serif}
.modebtn:hover{background:#fff}
.modebtn:active{transform:translateY(1px)}
</style>
</head>
<body>
<div id="stage">
<canvas id="c"></canvas>
<div class="title">Magnetfeld – Eisenfeilspäne</div>
<div class="hint" id="hintText">Die Eisenfeilspäne richten sich entlang des Magnetfeldes aus.</div>
<button id="modeBtn" class="modebtn" type="button">Kleine Kompasse zeigen</button>
</div>

<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let W,H,D,parts=[];
let mode="filings"; // "filings" = Eisenspäne, "compass" = kleine Kompasse

function geom(){
 const s=Math.min(W/1200,H/700);
 return {
  s,
  bar:{x:W*.27,y:H*.53,w:270*s,h:82*s},
  horse:{cx:W*.68,cy:H*.53,R:112*s,T:52*s,leg:98*s}
 };
}

/* Feldmodell: Stabmagnet + U-förmiger Hufeisenmagnet.
   Die Späne werden nicht exakt physikalisch berechnet, sondern
   anschaulich entlang eines plausiblen Feldverlaufs ausgerichtet. */
function field(x,y){
 const g=geom(),s=g.s;
 const h=g.horse;
 const poleX=h.cx+h.R+h.leg;
 const gx=x-h.cx, gy=y-h.cy;

 // Innerhalb der Öffnung des Hufeisenmagneten (zwischen den beiden Armen):
 // Das Feld verläuft dort senkrecht von N (oben) nach S (unten).
 if(gx>-h.R*.1 && gx<h.leg+h.R+15*s && Math.abs(gy)<h.R*.9){
  return [0,1];
 }

 let vx=0,vy=0;

 function pole(px,py,str){
   let dx=x-px,dy=y-py;
   let r2=Math.max(dx*dx+dy*dy,180*s*s);
   vx+=str*dx/r2; vy+=str*dy/r2;
 }

 // Stabmagnet: N links, S rechts
 const b=g.bar;
 pole(b.x-b.w/2,b.y, 14500*s*s);
 pole(b.x+b.w/2,b.y,-14500*s*s);

 // Hufeisen: N oben, S unten (für den Bereich außerhalb der Öffnung)
 pole(poleX,h.cy-h.R,19000*s*s);
 pole(poleX,h.cy+h.R,-19000*s*s);

 // leichte bogenförmige Rückführung um die Magnete
 const dx=x-h.cx,dy=y-h.cy,r=Math.hypot(dx,dy)+1;
 const arc=1150/Math.pow(r/s+1,1.35);
 vx+=(-dy/r)*arc;
 vy+=( dx/r)*arc*.7;

 const m=Math.hypot(vx,vy)||1;
 return [vx/m,vy/m];
}

function makeParts(){
 parts=[];
 if(mode==="compass"){
  const s=geom().s;
  const spacing=50*Math.max(s,.55);
  const rBase=8.5*Math.max(s,.55);
  for(let y=spacing*.6;y<H;y+=spacing){
   for(let x=spacing*.6;x<W;x+=spacing){
    const jx=(Math.random()-.5)*spacing*.3;
    const jy=(Math.random()-.5)*spacing*.3;
    parts.push({x:x+jx,y:y+jy,r:rBase*(.85+Math.random()*.3)});
   }
  }
 } else {
  const n=Math.min(12500,Math.max(6000,Math.round(W*H/100)));
  for(let i=0;i<n;i++){
   parts.push({
    x:Math.random()*W,y:Math.random()*H,
    len:2+Math.random()*5.2,
    a:.34+Math.random()*.5,
    w:.45+Math.random()*.8,
    p:Math.random()*Math.PI*2
   });
  }
 }
}

function drawParts(t){
 if(mode==="compass"){drawCompasses(t);return;}
 ctx.lineCap="round";
 for(const q of parts){
  const f=field(q.x,q.y);
  let a=Math.atan2(f[1],f[0])+Math.sin(q.p+t*.0009)*.025;
  const L=q.len;
  ctx.strokeStyle=`rgba(48,48,48,${q.a})`;
  ctx.lineWidth=q.w;
  ctx.beginPath();
  ctx.moveTo(q.x-Math.cos(a)*L/2,q.y-Math.sin(a)*L/2);
  ctx.lineTo(q.x+Math.cos(a)*L/2,q.y+Math.sin(a)*L/2);
  ctx.stroke();
 }
}

function drawCompasses(t){
 for(const q of parts){
  const f=field(q.x,q.y);
  const a=Math.atan2(f[1],f[0]);
  const r=q.r;
  ctx.save();
  ctx.translate(q.x,q.y);
  ctx.rotate(a);

  // Gehäuse
  ctx.beginPath();ctx.arc(0,0,r*1.3,0,Math.PI*2);
  ctx.fillStyle="rgba(255,255,255,.6)";ctx.fill();
  ctx.strokeStyle="rgba(70,70,70,.55)";ctx.lineWidth=r*.09;ctx.stroke();

  // Nadel: rote Spitze zeigt in Feldrichtung (N), weißes Ende (S)
  ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(r,0);ctx.lineTo(0,r*.3);ctx.closePath();
  ctx.fillStyle="#c8262c";ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(r,0);ctx.lineTo(0,-r*.3);ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(-r,0);ctx.lineTo(0,r*.3);ctx.closePath();
  ctx.fillStyle="#ececec";ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(-r,0);ctx.lineTo(0,-r*.3);ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="rgba(40,40,40,.5)";ctx.lineWidth=r*.06;
  ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.stroke();

  ctx.restore();
 }
}

function roundRect(x,y,w,h,r){
 ctx.beginPath();ctx.moveTo(x+r,y);
 ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
 ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

function drawBar(){
 const {bar:b,s}=geom(),x=b.x-b.w/2,y=b.y-b.h/2;
 ctx.save();
 ctx.shadowColor="rgba(0,0,0,.25)";ctx.shadowBlur=8*s;ctx.shadowOffsetY=5*s;
 const gr=ctx.createLinearGradient(x,0,x+b.w,0);
 gr.addColorStop(0,"#b31d24");gr.addColorStop(.49,"#df4147");
 gr.addColorStop(.5,"#f0f0f0");gr.addColorStop(1,"#999");
 roundRect(x,y,b.w,b.h,9*s);ctx.fillStyle=gr;ctx.fill();
 ctx.shadowColor="transparent";ctx.strokeStyle="#333";ctx.lineWidth=2*s;ctx.stroke();
 ctx.font=`bold ${34*s}px Arial`;ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillStyle="#fff";ctx.fillText("N",x+b.w*.25,b.y);
 ctx.fillStyle="#222";ctx.fillText("S",x+b.w*.75,b.y);
 ctx.restore();
}

function drawHorseshoe(){
 const {horse:h,s}=geom();

 // Vollständige U-Form: gebogener Rücken links + zwei gerade Arme nach
 // rechts bis zu den Polflächen. Oben/rot = N, unten/weiß = S.
 const left=h.cx-h.R, top=h.cy-h.R, bottom=h.cy+h.R;
 const armEndX=h.cx+h.R+h.leg;
 const T=h.T;

 ctx.save();
 ctx.lineCap="round";
 ctx.lineJoin="round";

 // Schatten: EIN zusammenhängender Pfad über Arm -> Bogen -> Arm,
 // damit nirgendwo eine Lücke entsteht
 ctx.strokeStyle="rgba(0,0,0,.22)";ctx.lineWidth=T+10*s;
 ctx.beginPath();
 ctx.moveTo(armEndX,top);
 ctx.lineTo(h.cx,top);
 ctx.arc(h.cx,h.cy,h.R,1.5*Math.PI,0.5*Math.PI,true);
 ctx.lineTo(armEndX,bottom);
 ctx.stroke();

 // Roter Teil (N): oberer Arm + obere Bogenhälfte, endet exakt am Scheitel links
 const redGrad=ctx.createLinearGradient(left,top,h.cx,h.cy);
 redGrad.addColorStop(0,"#9d171d");redGrad.addColorStop(.55,"#e4454b");redGrad.addColorStop(1,"#c72a30");
 ctx.strokeStyle=redGrad;ctx.lineWidth=T;
 ctx.beginPath();
 ctx.moveTo(armEndX,top);
 ctx.lineTo(h.cx,top);
 ctx.arc(h.cx,h.cy,h.R,1.5*Math.PI,Math.PI,true);
 ctx.stroke();

 // Weißer Teil (S): untere Bogenhälfte setzt genau da an, wo Rot endet,
 // + unterer Arm
 const whiteGrad=ctx.createLinearGradient(left,bottom,h.cx,h.cy);
 whiteGrad.addColorStop(0,"#a9a9a9");whiteGrad.addColorStop(.55,"#f5f5f5");whiteGrad.addColorStop(1,"#d8d8d8");
 ctx.strokeStyle=whiteGrad;
 ctx.beginPath();
 ctx.arc(h.cx,h.cy,h.R,Math.PI,0.5*Math.PI,true);
 ctx.lineTo(armEndX,bottom);
 ctx.stroke();

 // klare Trennkante am Scheitelpunkt links, wo Rot und Weiß aufeinandertreffen
 ctx.strokeStyle="#777";ctx.lineWidth=1.2*s;
 ctx.beginPath();
 ctx.moveTo(h.cx-h.R,h.cy-T/2);ctx.lineTo(h.cx-h.R,h.cy+T/2);ctx.stroke();

 // Polflächen direkt am Ende der Arme, bündig mit den Armen (keine schwebenden Teile mehr)
 ctx.fillStyle="#c72a30";
 ctx.fillRect(armEndX-7*s,top-T/2,9*s,T);
 ctx.fillStyle="#eeeeee";
 ctx.fillRect(armEndX-7*s,bottom-T/2,9*s,T);
 ctx.strokeStyle="#333";ctx.lineWidth=1*s;
 ctx.strokeRect(armEndX-7*s,top-T/2,9*s,T);
 ctx.strokeRect(armEndX-7*s,bottom-T/2,9*s,T);

 // Polbeschriftungen
 ctx.font=`bold ${28*s}px Arial`;ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillStyle="#fff";ctx.fillText("N",armEndX-2*s,top);
 ctx.fillStyle="#222";ctx.fillText("S",armEndX-2*s,bottom);

 // Glanz auf dem Rücken
 ctx.globalAlpha=.18;ctx.strokeStyle="#fff";ctx.lineWidth=5*s;
 ctx.beginPath();ctx.arc(h.cx-2*s,h.cy-2*s,h.R-5*s,1.5*Math.PI,0.5*Math.PI,true);ctx.stroke();

 ctx.restore();
}

function labels(){
 const {bar:b,horse:h,s}=geom();
 ctx.save();ctx.fillStyle="rgba(25,25,25,.8)";ctx.textAlign="center";
 ctx.font=`600 ${18*s}px Arial`;
 ctx.fillText("Stabmagnet",b.x,b.y+b.h*.9);
 ctx.fillText("Hufeisenmagnet",h.cx+h.leg*.4,h.cy+h.R+h.T*.9);
 ctx.restore();
}

function resize(){
 W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);
 canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);
 makeParts();
}
function loop(t){
 ctx.clearRect(0,0,W,H);ctx.fillStyle="#d6d6d6";ctx.fillRect(0,0,W,H);
 drawParts(t);drawBar();drawHorseshoe();labels();
 requestAnimationFrame(loop);
}
const modeBtn=document.getElementById("modeBtn");
const hintText=document.getElementById("hintText");
modeBtn.addEventListener("click",()=>{
 mode = mode==="filings" ? "compass" : "filings";
 if(mode==="compass"){
  modeBtn.textContent="Eisenspäne zeigen";
  hintText.textContent="Jeder kleine Kompass richtet sich mit seiner Nadel entlang des Magnetfeldes aus.";
 } else {
  modeBtn.textContent="Kleine Kompasse zeigen";
  hintText.textContent="Die Eisenfeilspäne richten sich entlang des Magnetfeldes aus.";
 }
 makeParts();
});

addEventListener("resize",resize);resize();requestAnimationFrame(loop);
</script>
</body>
</html>
